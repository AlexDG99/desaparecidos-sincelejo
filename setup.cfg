[flake8]
max-line-length = 160
exclude = .git,__pycache__,migrations,staticfiles,private_media,.venv
per-file-ignores =
    core/testing.py: E501
[coverage:run]
source = .
omit =
    */migrations/*
    */tests.py
    manage.py
    staticfiles/*
    config/wsgi.py
[coverage:report]
fail_under = 85
show_missing = False
