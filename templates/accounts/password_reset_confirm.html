{% extends 'base.html' %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
{% if validlink %}
  <h1 class="h3 mb-3">Defina su nueva contraseña</h1>
  <form method="post" novalidate>{% csrf_token %}{% include '_form.html' %}<button class="btn btn-primary" type="submit">Cambiar contraseña</button></form>
{% else %}
  <h1 class="h3">Enlace inválido o vencido</h1><p>Solicite uno nuevo.</p><a class="btn btn-primary" href="{% url 'accounts:password_reset' %}">Recuperar contraseña</a>
{% endif %}
</div></div>
{% endblock %}
