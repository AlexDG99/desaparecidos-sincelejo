{% extends 'base.html' %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <h1 class="h3 mb-3">Recuperar contraseña</h1>
  <p class="text-muted">Ingrese su correo y le enviaremos un enlace de un solo uso, válido por 60 minutos.</p>
  <form method="post" novalidate>{% csrf_token %}{% include '_form.html' %}<button class="btn btn-primary" type="submit">Enviar enlace</button></form>
</div></div>
{% endblock %}
