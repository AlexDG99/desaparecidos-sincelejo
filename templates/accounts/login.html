{% extends 'base.html' %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h3 mb-3">Ingresar</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include '_form.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
  </form>
  <p class="mt-3 mb-1"><a href="{% url 'accounts:password_reset' %}">¿Olvidó su contraseña?</a></p>
  <p>¿No tiene cuenta? <a href="{% url 'accounts:registro' %}">Regístrese como ciudadano</a> o <a href="{% url 'accounts:registro_familiar' %}">como familiar</a>.</p>
</div></div>
{% endblock %}
