{% if page.paginator.num_pages > 1 %}
<nav aria-label="Paginación" class="mt-4"><ul class="pagination justify-content-center flex-wrap">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Anterior</a></li>{% endif %}
  <li class="page-item active" aria-current="page"><span class="page-link">Página {{ page.number }} de {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Siguiente</a></li>{% endif %}
</ul></nav>
{% endif %}
