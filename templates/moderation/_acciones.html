{% if puede %}
<form method="post" class="card card-body mt-3" aria-label="Decisión de moderación">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label" for="motivo">Motivo (obligatorio para rechazar)</label><textarea class="form-control" id="motivo" name="motivo" rows="2"></textarea></div>
  <div class="d-flex flex-wrap gap-2">
    <button class="btn btn-success" type="submit" name="accion" value="aprobar">Aprobar y publicar</button>
    <button class="btn btn-danger" type="submit" name="accion" value="rechazar">Rechazar</button>
    {% if not user.es_administrador or obj_moderacion != 'sospechoso' %}<button class="btn btn-outline-warning" type="submit" name="accion" value="sospechoso">Marcar como sospechoso</button>{% endif %}
  </div>
</form>
{% else %}
<div class="alert alert-info mt-3" role="status">Este elemento está en estado «{{ obj_estado }}». Solo un administrador puede gestionarlo.</div>
{% endif %}
